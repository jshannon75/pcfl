<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Football Draft Board 2026</title>
  <!-- PapaParse for CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --my-team: #059669;
      --my-team-bg: #064e3b;
      --other-drafted: #1e293b;
      --favorite: #eab308;
      --border: #334155;

      /* Tier Colors */
      --tier-1-bg: rgba(245, 158, 11, 0.12);
      --tier-1-border: #f59e0b;
      --tier-2-bg: rgba(168, 85, 247, 0.12);
      --tier-2-border: #a855f7;
      --tier-3-bg: rgba(59, 130, 246, 0.12);
      --tier-3-border: #3b82f6;
      --tier-4-bg: rgba(16, 185, 129, 0.12);
      --tier-4-border: #10b981;
      --tier-5-bg: rgba(236, 72, 153, 0.12);
      --tier-5-border: #ec4899;
      --tier-6-bg: rgba(100, 116, 139, 0.12);
      --tier-6-border: #64748b;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1350px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 1.8rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .roster-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
    }

    .roster-card h3 {
      margin: 0 0 10px 0;
      font-size: 1rem;
      color: #10b981;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pos-counts {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .pos-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .my-team-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
    }

    .player-chip {
      background: var(--my-team-bg);
      border: 1px solid var(--my-team);
      color: #a7f3d0;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-chip span {
      cursor: pointer;
      font-weight: bold;
      color: #ef4444;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      align-items: center;
    }

    input[type="text"], select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
    }

    .btn-group {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .reset-btn {
      margin-left: auto;
      border-color: #ef4444;
      color: #ef4444;
    }

    .reset-btn:hover {
      background: #ef4444;
      color: #fff;
    }

    /* Table */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }

    th {
      background: #0f172a;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Tier Styling */
    tr.tier-1 { background-color: var(--tier-1-bg); border-left: 4px solid var(--tier-1-border); }
    tr.tier-2 { background-color: var(--tier-2-bg); border-left: 4px solid var(--tier-2-border); }
    tr.tier-3 { background-color: var(--tier-3-bg); border-left: 4px solid var(--tier-3-border); }
    tr.tier-4 { background-color: var(--tier-4-bg); border-left: 4px solid var(--tier-4-border); }
    tr.tier-5 { background-color: var(--tier-5-bg); border-left: 4px solid var(--tier-5-border); }
    tr.tier-6 { background-color: var(--tier-6-bg); border-left: 4px solid var(--tier-6-border); }

    .badge-tier-1 { background: var(--tier-1-border); color: #000; }
    .badge-tier-2 { background: var(--tier-2-border); color: #fff; }
    .badge-tier-3 { background: var(--tier-3-border); color: #fff; }
    .badge-tier-4 { background: var(--tier-4-border); color: #000; }
    .badge-tier-5 { background: var(--tier-5-border); color: #fff; }
    .badge-tier-6 { background: var(--tier-6-border); color: #fff; }

    /* Draft States */
    tr.drafted-other {
      background-color: var(--other-drafted) !important;
      opacity: 0.35;
      border-left: 4px solid #475569 !important;
    }

    tr.drafted-other .player-name {
      text-decoration: line-through;
    }

    tr.drafted-me {
      background-color: #064e3b !important;
      border-left: 4px solid var(--my-team) !important;
    }

    .star {
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--muted);
      user-select: none;
    }

    .star.active {
      color: var(--favorite);
    }

    .action-cell {
      display: flex;
      gap: 5px;
    }

    .btn-my-team {
      background: #047857;
      border-color: #059669;
      font-size: 0.75rem;
      padding: 4px 8px;
    }

    .btn-my-team:hover {
      background: #059669;
    }

    .btn-other {
      background: #475569;
      border-color: #64748b;
      font-size: 0.75rem;
      padding: 4px 8px;
    }

    .btn-other:hover {
      background: #64748b;
    }

    .btn-undo {
      background: #b91c1c;
      border-color: #ef4444;
      font-size: 0.75rem;
      padding: 4px 8px;
    }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    #loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .error-msg {
      color: #ef4444;
      background: #451a1a;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Draft Assistant Board</h1>
    <div class="subtitle">Data source: <code>FantasyPros_2026.csv</code></div>
  </header>

  <div id="errorBox" class="error-msg"></div>

  <!-- Dashboard -->
  <div class="dashboard">
    <div class="roster-card">
      <h3>
        My Team Summary
        <span id="totalMyTeamCount">0 Players</span>
      </h3>
      <div class="pos-counts">
        <span class="pos-pill">QB: <span id="countQB">0</span></span>
        <span class="pos-pill">RB: <span id="countRB">0</span></span>
        <span class="pos-pill">WR: <span id="countWR">0</span></span>
        <span class="pos-pill">TE: <span id="countTE">0</span></span>
      </div>
      <div class="my-team-list" id="myTeamChips">
        <span style="color: var(--muted); font-size: 0.85rem;">No players drafted to your team yet.</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search player, team, or position..." oninput="renderTable()">
    
    <select id="tierFilter" onchange="renderTable()">
      <option value="ALL">All Tiers</option>
      <option value="1">Tier 1</option>
      <option value="2">Tier 2</option>
      <option value="3">Tier 3</option>
      <option value="4">Tier 4</option>
      <option value="5">Tier 5</option>
      <option value="6">Tier 6+</option>
    </select>

    <div class="btn-group" id="posFilters">
      <button class="active" onclick="setPosFilter('ALL')">All</button>
      <button onclick="setPosFilter('RB')">RB</button>
      <button onclick="setPosFilter('WR')">WR</button>
      <button onclick="setPosFilter('TE')">TE</button>
      <button onclick="setPosFilter('QB')">QB</button>
      <button onclick="setPosFilter('FAV')">★ Favs</button>
      <button onclick="setPosFilter('MY_TEAM')">My Team</button>
      <button onclick="setPosFilter('AVAIL')">Available</button>
    </div>

    <button class="reset-btn" onclick="resetDraft()">Reset Board</button>
  </div>

  <div class="table-container">
    <div id="loading">Loading player data...</div>
    <table id="mainTable" style="display: none;">
      <thead>
        <tr>
          <th>Fav</th>
          <th>RK</th>
          <th>Tier</th>
          <th>Player</th>
          <th>Team</th>
          <th>Pos</th>
          <th>Bye</th>
          <th>Upside</th>
          <th>Bust</th>
          <th>SOS</th>
          <th>ECR vs ADP</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="playerTable"></tbody>
    </table>
  </div>
</div>

<script>
  let rawData = [];
  let currentPosFilter = 'ALL';
  let favorites = JSON.parse(localStorage.getItem('fav_players')) || [];
  let myTeam = JSON.parse(localStorage.getItem('my_team_players')) || [];
  let otherDrafted = JSON.parse(localStorage.getItem('other_drafted_players')) || [];

  // Parse CSV
  Papa.parse('FantasyPros_2026.csv', {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('mainTable').style.display = 'table';

      rawData = results.data.map(row => {
        const getVal = (keys) => {
          for (let k of keys) {
            const matched = Object.keys(row).find(header => header.trim().toLowerCase() === k.toLowerCase());
            if (matched && row[matched] !== undefined) return row[matched].trim();
          }
          return '';
        };

        const posRaw = getVal(['POS', 'POSITION']);
        const posGroup = posRaw.replace(/[0-9]/g, '').toUpperCase();

        return {
          rk: getVal(['RK', 'RANK', 'RANKING']) || row[Object.keys(row)[0]],
          tier: getVal(['TIERS', 'TIER']),
          name: getVal(['PLAYER NAME', 'PLAYER', 'NAME']),
          team: getVal(['TEAM']),
          pos: posRaw,
          posGroup: posGroup,
          bye: getVal(['BYE WEEK', 'BYE']),
          upside: cleanRating(getVal(['UPSIDE'])),
          bust: cleanRating(getVal(['BUST'])),
          sos: cleanRating(getVal(['SOS SEASON', 'SOS'])),
          ecrVsAdp: getVal(['ECR VS. ADP', 'ECR VS ADP'])
        };
      });

      renderTable();
    },
    error: function(err) {
      document.getElementById('loading').style.display = 'none';
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'block';
      errorBox.innerHTML = `<strong>Error loading CSV:</strong> Ensure <code>FantasyPros_2026.csv</code> is in the root directory.`;
    }
  });

  function cleanRating(str) {
    if (!str) return '-';
    return str.replace(/\s*out of\s*/gi, '/').replace(/\s*stars?/gi, '').trim();
  }

  function setPosFilter(filter) {
    currentPosFilter = filter;
    document.querySelectorAll('#posFilters button').forEach(btn => {
      btn.classList.toggle('active', btn.innerText.includes(filter) || (filter === 'ALL' && btn.innerText === 'All'));
    });
    renderTable();
  }

  function toggleFav(rk) {
    if (favorites.includes(rk)) {
      favorites = favorites.filter(id => id !== rk);
    } else {
      favorites.push(rk);
    }
    localStorage.setItem('fav_players', JSON.stringify(favorites));
    renderTable();
  }

  function draftToMyTeam(rk) {
    if (!myTeam.includes(rk)) {
      myTeam.push(rk);
      otherDrafted = otherDrafted.filter(id => id !== rk);
      localStorage.setItem('my_team_players', JSON.stringify(myTeam));
      localStorage.setItem('other_drafted_players', JSON.stringify(otherDrafted));
    }
    renderTable();
  }

  function draftToOther(rk) {
    if (!otherDrafted.includes(rk)) {
      otherDrafted.push(rk);
      myTeam = myTeam.filter(id => id !== rk);
      localStorage.setItem('other_drafted_players', JSON.stringify(otherDrafted));
      localStorage.setItem('my_team_players', JSON.stringify(myTeam));
    }
    renderTable();
  }

  function undraftPlayer(rk) {
    myTeam = myTeam.filter(id => id !== rk);
    otherDrafted = otherDrafted.filter(id => id !== rk);
    localStorage.setItem('my_team_players', JSON.stringify(myTeam));
    localStorage.setItem('other_drafted_players', JSON.stringify(otherDrafted));
    renderTable();
  }

  function resetDraft() {
    if (confirm("Reset all drafted players and favorites?")) {
      favorites = [];
      myTeam = [];
      otherDrafted = [];
      localStorage.removeItem('fav_players');
      localStorage.removeItem('my_team_players');
      localStorage.removeItem('other_drafted_players');
      renderTable();
    }
  }

  function updateDashboard() {
    const myPlayers = rawData.filter(p => myTeam.includes(p.rk));
    document.getElementById('totalMyTeamCount').innerText = `${myPlayers.length} Players`;

    const counts = { QB: 0, RB: 0, WR: 0, TE: 0 };
    myPlayers.forEach(p => {
      if (counts[p.posGroup] !== undefined) counts[p.posGroup]++;
    });

    document.getElementById('countQB').innerText = counts.QB;
    document.getElementById('countRB').innerText = counts.RB;
    document.getElementById('countWR').innerText = counts.WR;
    document.getElementById('countTE').innerText = counts.TE;

    const chipContainer = document.getElementById('myTeamChips');
    if (myPlayers.length === 0) {
      chipContainer.innerHTML = `<span style="color: var(--muted); font-size: 0.85rem;">No players drafted to your team yet.</span>`;
    } else {
      chipContainer.innerHTML = myPlayers.map(p => `
        <div class="player-chip">
          <strong>${p.pos}</strong> ${p.name}
          <span onclick="undraftPlayer('${p.rk}')" title="Remove player">×</span>
        </div>
      `).join('');
    }
  }

  function renderTable() {
    updateDashboard();

    const searchVal = document.getElementById('searchInput').value.toLowerCase();
    const tierVal = document.getElementById('tierFilter').value;
    const tbody = document.getElementById('playerTable');
    tbody.innerHTML = '';

    const filtered = rawData.filter(p => {
      const matchesSearch = p.name.toLowerCase().includes(searchVal) || 
                            p.team.toLowerCase().includes(searchVal) || 
                            p.pos.toLowerCase().includes(searchVal);
      const isFav = favorites.includes(p.rk);
      const isMyTeam = myTeam.includes(p.rk);
      const isOther = otherDrafted.includes(p.rk);

      let matchesPos = false;
      if (currentPosFilter === 'ALL') matchesPos = true;
      else if (currentPosFilter === 'FAV') matchesPos = isFav;
      else if (currentPosFilter === 'MY_TEAM') matchesPos = isMyTeam;
      else if (currentPosFilter === 'AVAIL') matchesPos = (!isMyTeam && !isOther);
      else matchesPos = (p.posGroup === currentPosFilter);

      let matchesTier = (tierVal === 'ALL' || p.tier === tierVal);

      return matchesSearch && matchesPos && matchesTier;
    });

    filtered.forEach(p => {
      const isFav = favorites.includes(p.rk);
      const isMyTeam = myTeam.includes(p.rk);
      const isOther = otherDrafted.includes(p.rk);
      
      const tr = document.createElement('tr');

      // Tier Class (caps at tier 6 for styling)
      const tierNum = parseInt(p.tier) || 6;
      const tierClass = `tier-${Math.min(tierNum, 6)}`;
      tr.classList.add(tierClass);

      if (isMyTeam) tr.classList.add('drafted-me');
      if (isOther) tr.classList.add('drafted-other');

      let actionButtons = '';
      if (isMyTeam || isOther) {
        actionButtons = `<button class="btn-undo" onclick="undraftPlayer('${p.rk}')">Undo</button>`;
      } else {
        actionButtons = `
          <button class="btn-my-team" onclick="draftToMyTeam('${p.rk}')">+ My Team</button>
          <button class="btn-other" onclick="draftToOther('${p.rk}')">Drafted</button>
        `;
      }

      tr.innerHTML = `
        <td><span class="star ${isFav ? 'active' : ''}" onclick="toggleFav('${p.rk}')">★</span></td>
        <td>${p.rk}</td>
        <td><span class="badge badge-${tierClass}">T${p.tier}</span></td>
        <td class="player-name"><strong>${p.name}</strong></td>
        <td>${p.team}</td>
        <td>${p.pos}</td>
        <td>${p.bye}</td>
        <td>${p.upside}</td>
        <td>${p.bust}</td>
        <td>${p.sos}</td>
        <td>${p.ecrVsAdp}</td>
        <td class="action-cell">${actionButtons}</td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>
</body>
</html>
